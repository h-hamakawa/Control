{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ログイン - Control</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-container">
  <div class="auth-logo">Control</div>
  <p class="auth-subtitle">家計管理アプリ</p>

  {% if messages %}
    {% for message in messages %}
    <div class="alert alert-error" style="width:100%;margin-bottom:16px;">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="post" class="auth-form">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">メールアドレス</label>
      {{ form.username }}
    </div>
    <div class="form-group">
      <label class="form-label">パスワード</label>
      {{ form.password }}
    </div>
    <button type="submit" class="btn btn-primary">ログイン</button>
  </form>

  <div class="auth-link">
    アカウントをお持ちでない方は <a href="{% url 'register' %}">新規登録</a>
  </div>
</div>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
